simulation:
  num_clients: 50
  num_rounds: 150
  clients_per_round: 10

churn:
  drop_prob: 0.3
  min_rejoin_delay: 10     # was 3 — cars gone much longer
  max_rejoin_delay: 40     # was 10 — some cars gone for 40 rounds
  rejoin_prob: 0.6         # was 0.8 — harder to rejoin

data:
  dataset: cifar100
  dirichlet_alpha: 0.3     # was 0.5 — extreme heterogeneity

training:
  local_epochs: 3
  batch_size: 512
  learning_rate: 0.005
  optimizer: sgd
  momentum: 0.9
  weight_decay: 0.001

hardware:
  min_speed: 0.3
  max_speed: 2.5

model:
  name: resnet
  num_classes: 100

aggregation:
  strategy: FEDAVG
  staleness_alpha: 0.9
  loss_threshold: 5      # tighter quality gate for ADAPTIVE

eval_every: 10
checkpoint_every: 30
seed: 42