simulation:
  num_clients: 50
  num_rounds: 100
  clients_per_round: 10

model:
  name: resnet
  num_classes: 100

data:
  dataset: cifar100
  dirichlet_alpha: 0.5     # overridden by sweep

hardware:
 homogeneous: True        # true => every car identical 
 speed_range:       [0.3, 2.5]
 memory_range:      [32, 512]
 reliability_range: [0.70, 1.00]

churn:
  drop_prob: 0.0           # no churn
  min_rejoin_delay: 1
  max_rejoin_delay: 5
  rejoin_prob: 0.8

aggregation:
  strategy: FEDAVG
  staleness_alpha: 0.9
  loss_threshold: 5.0

training:
  local_epochs: 10
  batch_size: 64
  learning_rate: 0.01
  optimizer: sgd
  momentum: 0.9
  weight_decay: 0.001

eval_every: 5
checkpoint_every: 25
seed: 42