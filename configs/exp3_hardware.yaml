simulation:
  num_clients: 50
  num_rounds: 80
  clients_per_round: 10

model:
  name: resnet
  num_classes: 100

data:
  dataset: cifar100
  dirichlet_alpha: 0.3       # FIXED mild skew \xe2\x80\x94 stable baseline; hardware is the variable
                            # (memory\xc3\x97skew interaction is a possible follow-up)

hardware:
  homogeneous: False        # hardware is now the VARIABLE \xe2\x80\x94 use explicit ranges
  speed_range:       [1.0, 1.0]   # ideal unless the speed sweep overrides it
  memory_range:      [64, 64]     # ideal (= batch_size, no clamp) unless overridden
  reliability_range: [1.0, 1.0]   # ideal (no faults) unless overridden

churn:
  drop_prob: 0.0            # NO churn \xe2\x80\x94 isolate hardware from participation
  min_rejoin_delay: 1
  max_rejoin_delay: 5
  rejoin_prob: 1.0

aggregation:
  strategy: FEDAVG         # canonical; staleness irrelevant with no churn

training:
  local_epochs: 5
  batch_size: 64
  learning_rate: 0.01
  optimizer: sgd
  momentum: 0.9
  weight_decay: 0.001

eval_every: 5
checkpoint_every: 25
seed: 42