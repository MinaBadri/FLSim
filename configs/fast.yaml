# configs/fast.yaml — same as churn.yaml but faster
simulation:
  num_clients: 20         
  num_rounds: 50          
  clients_per_round: 5     

model:
  name: cnn
  num_classes: 10

data:
  dataset: cifar100
  num_classes: 100
  dirichlet_alpha: 0.05 

hardware:
 homogeneous: false        # true => every car identical (neutralizes hardware as a control)
 speed_range:       [0.3, 2.5]
 memory_range:      [32, 512]
 reliability_range: [0.70, 1.00]

churn:
  drop_prob: 0.3
  min_rejoin_delay: 3
  max_rejoin_delay: 10
  rejoin_prob: 0.8

aggregation:
  strategy: FEDAVG
  staleness_alpha: 0.9
  loss_threshold: 2.0

training:
  local_epochs: 2         
  batch_size: 32
  learning_rate: 0.01
  optimizer: sgd
  momentum: 0.9
  weight_decay: 0.0001

eval_every: 10
checkpoint_every: 25
seed: 42