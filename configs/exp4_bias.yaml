simulation:
  num_clients: 50
  num_rounds: 80
  clients_per_round: 10

model:
  name: resnet
  num_classes: 100

data:
  dataset: cifar100
  dirichlet_alpha: 0.05    # severe skew: classes concentrate on few clients -> clean ownership

hardware:
  homogeneous: True        # ignored by RQ4 runner (it injects per-condition profiles); kept valid

churn:
  drop_prob: 0.0           # churn OFF: isolate hardware (matches RQ3)
  min_rejoin_delay: 1
  max_rejoin_delay: 1
  rejoin_prob: 1.0

aggregation:
  strategy: FEDAVG

training:
  local_epochs: 5
  batch_size: 64
  learning_rate: 0.01
  optimizer: sgd
  momentum: 0.9
  weight_decay: 0.001

eval_every: 5
checkpoint_every: 50
seed: 42