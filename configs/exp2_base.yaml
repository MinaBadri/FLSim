# configs/exp2_base.yaml — RQ2 (churn) base. FedAvg fixed, hardware neutralized,
# heterogeneity fixed; only churn varies (via the sweep).
simulation:
  num_clients: 50
  num_rounds: 80
  clients_per_round: 10

model:
  name: resnet
  num_classes: 100

data:
  dataset: cifar100
  dirichlet_alpha: 0.05        # FIXED — moderate skew: stable baseline, but absent
                              # clients still carry distinct classes so churn bites

hardware:
  homogeneous: True           # isolate churn: reliability=1.0 (no hardware faults),
                              # no batch-size clamp, uniform speed
  speed_range:       [0.3, 2.5]
  memory_range:      [32, 512]
  reliability_range: [0.70, 1.00]

churn:
  drop_prob: 0.0              # overridden by the sweep
  min_rejoin_delay: 1
  max_rejoin_delay: 3         # overridden in the lateness sweep
  rejoin_prob: 1.0            # deterministic return after the delay -> clean lateness axis

aggregation:
  strategy: FEDAVG            # FIXED for RQ2 (staleness-aware comparison is RQ6)
  staleness_alpha: 0.9
  loss_threshold: 5.0

training:
  local_epochs: 5
  batch_size: 64
  learning_rate: 0.01
  optimizer: sgd
  momentum: 0.9
  weight_decay: 0.001

eval_every: 5
checkpoint_every: 25
seed: 42
