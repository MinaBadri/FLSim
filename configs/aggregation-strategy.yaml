# configs/exp6_base.yaml — RQ6 (aggregation strategies) base.
# Held in RQ2's worst case (severe skew + churn) where FedAvg bleeds most, so a
# smarter aggregator has something to prove. strategy + delay come from the sweep.
simulation:
  num_clients: 50
  num_rounds: 60
  clients_per_round: 10

model:
  name: resnet
  num_classes: 100

data:
  dataset: cifar100
  dirichlet_alpha: 0.05        # FIXED severe skew — the regime where churn bites

hardware:
  homogeneous: True            # isolate aggregation: no hardware faults/clamp
  speed_range:       [0.3, 2.5]
  memory_range:      [32, 512]
  reliability_range: [0.70, 1.00]

churn:
  drop_prob: 0.3               # FIXED moderate-high rate (pool starves at long delay)
  min_rejoin_delay: 1
  max_rejoin_delay: 50         # overridden by the sweep (3 = low churn, 50 = worst case)
  rejoin_prob: 1.0

aggregation:
  strategy: FEDAVG             # overridden by the sweep
  staleness_alpha: 0.97        # decay per stale round. NOT 0.9: at staleness~50,
                               # 0.9^50=0.005 would delete returning clients, not
                               # down-weight them. 0.97^50=0.22 is a real gradient.
                               # Confirm against avg_staleness in history.json.
  loss_threshold: 5.0          # ADAPTIVE hard-reject ceiling; above per-client
                               # training-loss range, so it rarely fires (soft
                               # 1/(1+loss) does the work). Watch for frozen rounds.
  staleness_boost: 0.1         # extra weight per stale round (linear)
  max_boost: 3.0               # cap; one returner can't exceed this multiple

training:
  local_epochs: 5
  batch_size: 64
  learning_rate: 0.01
  optimizer: sgd
  momentum: 0.9
  weight_decay: 0.001

eval_every: 5
checkpoint_every: 25
seed: 42